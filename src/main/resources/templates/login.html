<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-shell page-main page-main--narrow">
    <section class="panel">
        <h1>Admin Login</h1>
        <p class="lead">Sign in to manage wiki articles.</p>

        <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Invalid login.</p>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" class="form-stack">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" th:field="*{username}" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" th:field="*{password}" autocomplete="current-password" required>
            </div>

            <div class="button-row">
                <button type="submit" class="button button-primary">Log in</button>
                <a th:href="@{/}" class="button button-secondary">Back to Home</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
