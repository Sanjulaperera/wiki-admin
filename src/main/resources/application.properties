# application.properties
# Author: Sanjula Perera | Student ID: S1532573
# BIT235 Assessment 2 Part B - Wiki Content Management and Admin Console
#
# Spring Boot configuration file.
# Spring Boot automatically loads this file on startup.

# -----------------------------------------------
# Server Configuration
# -----------------------------------------------

server.port=8080

# -----------------------------------------------
# Application Name
# -----------------------------------------------

spring.application.name=wiki-admin

# -----------------------------------------------
# Database
# -----------------------------------------------

spring.datasource.url=jdbc:h2:mem:wikiadmin
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -----------------------------------------------
# Thymeleaf Configuration
# -----------------------------------------------

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.cache=false

# -----------------------------------------------
# Logging
# -----------------------------------------------

logging.level.com.wiki.admin=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
debug=false
